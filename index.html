<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ludo Royale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="lobby" class="screen">
      <div class="brand">LUDO ROYALE</div>
      <p class="eyebrow">ONLINE MULTIPLAYER</p>
      <h1>Roll. Move.<br><em>Conquer.</em></h1>
      <div class="card lobby-card">
        <label>Your name</label>
        <input id="nameInput" maxlength="16" placeholder="Enter your name" autocomplete="nickname" />
        <button id="createBtn" class="primary">CREATE ROOM</button>
        <div class="divider"><span>OR</span></div>
        <label>Room code</label>
        <input id="roomInput" maxlength="5" placeholder="ABCDE" autocapitalize="characters" />
        <button id="joinBtn" class="secondary">JOIN ROOM</button>
        <p id="lobbyMsg" class="message"></p>
      </div>
    </section>

    <section id="room" class="screen hidden">
      <header class="topbar">
        <div><span class="eyebrow">ROOM</span><strong id="roomCode">-----</strong></div>
        <button id="copyBtn" class="small-btn">COPY CODE</button>
      </header>
      <div class="card waiting">
        <h2>Waiting for players</h2>
        <p>Share the room code with your friends.</p>
        <div id="roomPlayers" class="room-players"></div>
        <button id="startBtn" class="primary hidden">START GAME</button>
        <p id="roomMsg" class="message"></p>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <header class="game-head">
        <div><span class="eyebrow">ROOM <b id="gameRoom">-----</b></span><h2>Ludo<br>Royale</h2></div>
        <div id="turnBadge" class="turn-badge">WAITING</div>
      </header>

      <div id="board" class="board" aria-label="Ludo board"></div>

      <div id="players" class="players"></div>

      <div class="dice-panel card">
        <div class="dice-label">DICE</div>
        <div id="dice" class="die" data-value="0"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <p id="diceHint">Your turn — roll the dice.</p>
        <button id="rollBtn" class="primary">ROLL DICE</button>
      </div>
      <p id="gameMsg" class="message"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
