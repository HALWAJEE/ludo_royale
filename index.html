<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ludo Royale</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="room-label">ROOM <span id="roomCode">-----</span></div>
        <h1>Ludo<br>Royale</h1>
      </div>
      <div id="turnBadge" class="turn-badge">CONNECTING…</div>
    </header>

    <section id="lobby" class="lobby card">
      <h2>Play with friends</h2>
      <p class="muted">Create a room and share the code, or join your friend's room.</p>
      <input id="nameInput" maxlength="16" placeholder="Your name" value="Player" />
      <div class="lobby-actions">
        <button id="createBtn" class="primary">CREATE ROOM</button>
        <button id="joinBtn" class="secondary">JOIN ROOM</button>
      </div>
      <input id="roomInput" maxlength="5" placeholder="Room code" autocomplete="off" />
      <button id="startBtn" class="start hidden">START GAME</button>
      <div id="playersLobby" class="players-lobby"></div>
      <div id="error" class="error"></div>
    </section>

    <section id="game" class="hidden">
      <div class="board-wrap">
        <div id="board" class="board" aria-label="Ludo board"></div>
      </div>

      <section class="players" id="players"></section>

      <section class="dice-card card">
        <div class="dice-label">DICE</div>
        <div id="die" class="die" aria-live="polite">–</div>
        <button id="rollBtn" class="primary roll-btn">ROLL DICE</button>
        <div id="hint" class="hint">Waiting for the game to start…</div>
      </section>

      <button id="copyBtn" class="copy-btn">COPY ROOM CODE</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
