<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ludo Royale Live</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- Lobby Card -->
    <div id="lobby-section" class="panel glass-card">
      <div class="logo-area">
        <div class="crown-icon">👑</div>
        <h1>LUDO ROYALE</h1>
        <p class="subtitle">Online Multiplayer Arena</p>
      </div>

      <div class="form-group">
        <label for="player-name-input">Your Display Name</label>
        <input type="text" id="player-name-input" placeholder="e.g. Champion" maxlength="12" />
      </div>

      <div class="actions-stack">
        <button id="create-room-btn" class="btn btn-primary pulse">Create New Game</button>
        <div class="divider"><span>OR JOIN WITH CODE</span></div>
        <div class="join-row">
          <input type="text" id="room-code-input" placeholder="CODE" maxlength="4" />
          <button id="join-room-btn" class="btn btn-accent">Join Game</button>
        </div>
      </div>
    </div>

    <!-- Room Lobby Card -->
    <div id="room-section" class="panel glass-card hidden">
      <h2>Room Code: <span id="display-room-code" class="highlight-code"></span></h2>
      <p class="share-hint">Share this code with your friends to join</p>

      <div class="player-roster">
        <h3>Lobby Players (<span id="player-count">0</span>/4)</h3>
        <div id="players-list" class="roster-grid"></div>
      </div>

      <div class="lobby-action-box">
        <button id="start-game-btn" class="btn btn-primary hidden">Start Match</button>
        <div id="waiting-text" class="pulsing-text">Waiting for host to start...</div>
      </div>
    </div>

    <!-- Active Game Arena -->
    <div id="game-section" class="panel game-arena hidden">
      <div class="game-hud">
        <div class="hud-top">
          <span class="room-chip">Room: <b id="game-room-id"></b></span>
          <div id="turn-badge" class="turn-chip">Red's Turn</div>
        </div>

        <div class="game-control-row">
          <div class="dice-box" id="dice-container">
            <div id="3d-dice" class="dice-3d face-1">
              <div class="pip-face f1"><span class="pip"></span></div>
              <div class="pip-face f2"><span class="pip"></span><span class="pip"></span></div>
              <div class="pip-face f3"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="pip-face f4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="pip-face f5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="pip-face f6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            </div>
          </div>
          <button id="roll-action-btn" class="btn btn-primary roll-btn">Roll Dice</button>
        </div>

        <div id="game-status-msg" class="hud-message">Game is starting...</div>
      </div>

      <div class="board-canvas-holder">
        <canvas id="ludoCanvas" width="600" height="600"></canvas>
      </div>
    </div>
  </div>
</body>
</html>
