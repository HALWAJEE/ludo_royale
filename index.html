<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Royale Online</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>LUDO <span>ROYALE</span></b><small>ONLINE MULTIPLAYER</small></header><main>
<section id="lobby"><div class="hero"><small>PRIVATE ROOMS • REAL-TIME PLAY</small><h1>Roll.<br><i>Race.</i><br>Rule the board.</h1><p>Play with friends from different networks using a simple room code.</p></div><div class="card"><label>Your name</label><input id="name" maxlength="16" placeholder="Your name"><button id="create">CREATE ROOM</button><div class="or">OR</div><div class="join"><input id="room" maxlength="5" placeholder="ROOM CODE"><button id="join">JOIN</button></div><p id="msg"></p></div></section>
<section id="waiting" class="hidden"><small>ROOM</small><h2 id="code">-----</h2><p>Share this code with your friends.</p><div id="players" class="players"></div><button id="start">START GAME</button><p id="wmsg"></p></section>
<section id="game" class="hidden"><div class="top"><div><small>ROOM <span id="gcode"></span></small><h2>Ludo Royale</h2></div><strong id="turn"></strong></div><div class="layout"><div class="board" id="board"></div><aside><div id="gplayers" class="players"></div><div class="dice"><small>DICE</small><div id="die">–</div><button id="roll">ROLL DICE</button><p id="status"></p></div></aside></div></section></main><script src="app.js"></script></body></html>
