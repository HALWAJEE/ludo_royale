<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ludo Classic Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <header class="header">
      <h1>Ludo Classic</h1>
      <div class="status-panel">
        <div id="turn-indicator" class="turn-box">Turn: <span id="current-player-name">Red</span></div>
        <div class="dice-section">
          <button id="roll-btn" class="btn">Roll Dice</button>
          <div id="dice-display" class="dice">1</div>
        </div>
      </div>
      <div id="message" class="message-box">Click "Roll Dice" to start!</div>
    </header>

    <div class="board-wrapper">
      <canvas id="ludoCanvas" width="600" height="600"></canvas>
    </div>

    <div class="controls">
      <button id="reset-btn" class="btn secondary">Reset Game</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
